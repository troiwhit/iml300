<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Remember</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
        <script defer src="memories.js"></script>
    </head>
    <body class="memories-page">
        <div id="sleet-background" aria-hidden="true"></div>
        <main class="memory-scene" aria-labelledby="memory-title">
            <h1 id="memory-title" class="scene-title">some things stay with you.</h1>
         <div class="falling-figure">
      <img
        src="falling-body.png"
        alt="A figure falling through darkness"
      >
    </div>

    <!-- Happy memory -->
    <a
      class="memory memory-happy"
      href="memory-happy.html"
      aria-label="Enter the happy memory">

      <span class="memory-orb">
        <img
          src="Happiest.jpg"
          alt=""
        >
      </span>

      <span class="memory-label">
        a moment of joy
      </span>
    </a>

    <!-- Sad memory -->
    <a
      class="memory memory-sad"
      href="memory-sad.html"
      aria-label="Enter the sad memory">
        <span class="memory-orb">
        <img
          src="Sad.jpeg"
          alt=""
        >
      </span>

      <span class="memory-label">
        a moment of sadness
      </span>
    </a>

    <!-- Calm memory -->
    <a
      class="memory memory-calm"
      href="memory-calm.html"
      aria-label="Enter the calm memory">

      <span class="memory-orb">
        <img
          src="O28.jpeg"
          alt=""
        >
      </span>

      <span class="memory-label">
        a moment of stillness
      </span>
    </a>
            
        </main>
    </body>
</html>
